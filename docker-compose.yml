services:

  # MongoDB
  mongo:
    image: mongo:7
    container_name: tienda-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-admin12345}
      MONGO_INITDB_DATABASE: tienda
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - tienda-net

  # Cassandra
  cassandra:
    image: cassandra:5.0
    container_name: tienda-cassandra
    restart: unless-stopped
    environment:
      CASSANDRA_CLUSTER_NAME: tienda-cluster
      CASSANDRA_DC: dc1
      CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    ports:
      - "9042:9042"
    volumes:
      - cassandra_data:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES' > /dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      - tienda-net

  # Servicio de un solo uso: crea el keyspace y las tablas cuando Cassandra está lista, y luego termina.
  cassandra-init:
    image: cassandra:5.0
    container_name: tienda-cassandra-init
    restart: "no"
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./cassandra/init.cql:/init.cql:ro
    entrypoint: ["cqlsh", "cassandra", "9042", "-f", "/init.cql"]
    networks:
      - tienda-net

  # Neo4j
  neo4j:
    image: neo4j:5-community
    container_name: tienda-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_USER:-admin}/${NEO4J_PASSWORD:-admin12345}
    ports:
      - "7474:7474"   # Navegador web de Neo4j
      - "7687:7687"   # Protocolo Bolt (lo usa la API)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-neo4j12345} 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 30s
    networks:
      - tienda-net

  # API (FastAPI)
  api:
    build: ./backend
    container_name: tienda-api
    restart: unless-stopped
    environment:
      MONGO_URI: mongodb://${MONGO_USER:-admin}:${MONGO_PASSWORD:-admin12345}@mongo:27017/?authSource=admin
      MONGO_DB: tienda
      CASSANDRA_HOSTS: cassandra
      CASSANDRA_KEYSPACE: tienda
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-admin}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-admin12345}
    ports:
      - "8000:8000"
    depends_on:
      mongo:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
    networks:
      - tienda-net

volumes:
  mongo_data:
  cassandra_data:
  neo4j_data:

networks:
  tienda-net:
    driver: bridge